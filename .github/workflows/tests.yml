name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-tests:
    name: R tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590  # v2.11.4
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: renv/library
          key: r-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            r-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libpoppler-cpp-dev

      - name: Restore R packages
        run: Rscript -e "Sys.setenv(RENV_CONFIG_SNAPSHOT_PROMPT = 'false'); renv::restore()"

      - name: Lint R sources
        run: Rscript tests/run_lintr.R

      - name: Run R tests
        run: Rscript tests/run_shared_helper_smoke_tests.R

  js-tests:
    name: JS tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: npm run test:smoke

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: npx playwright install-deps chromium firefox

      - name: Install Playwright Chromium browser
        # playwright.config.js declares three projects: chromium (full suite),
        # firefox (navigation.spec.js canary), and mobile-chrome (navigation
        # canary on Pixel 7 emulation). mobile-chrome uses the Chromium engine
        # so no separate mobile-chrome install is needed.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        env:
          DEBUG: pw:install
        run: npx playwright install chromium

      - name: Install Playwright Firefox browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        env:
          DEBUG: pw:install
        run: npx playwright install firefox

      - name: Run Playwright e2e tests
        run: npm run test:e2e

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: |
          python tests/test_import_closure_sheet.py
          python tests/test_build_federal_composite_scores.py
          python tests/test_build_hcm_level2.py
          python tests/test_import_supabase.py
