name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-tests:
    name: R tests
    runs-on: ubuntu-24.04
    env:
      RENV_CONFIG_CACHE_SYMLINKS: "FALSE"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590  # v2.11.4
        with:
          r-version: "4.5.3"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: renv/library
          key: r-ubuntu-24.04-${{ hashFiles('renv.lock') }}
          restore-keys: |
            r-ubuntu-24.04-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libcurl4-openssl-dev \
            libjpeg-dev \
            libpoppler-cpp-dev \
            libx11-dev \
            pandoc

      - name: Restore R packages
        run: Rscript -e "Sys.setenv(RENV_CONFIG_SNAPSHOT_PROMPT = 'false'); renv::restore()"

      - name: Lint R sources
        run: Rscript tests/run_lintr.R

      - name: Run R tests
        run: Rscript tests/run_shared_helper_smoke_tests.R

  js-tests:
    name: JS tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: npm run test:smoke

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp/.docker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Prepare writable Docker config
        run: mkdir -p /tmp/.docker

      - name: Run Playwright e2e tests
        run: npm run test:e2e

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: |
          python tests/test_import_closure_sheet.py
          python tests/test_update_drift_state.py
          python tests/test_build_federal_composite_scores.py
          python tests/test_build_hcm_level2.py
          python tests/test_import_supabase.py
          python tests/test_cuts_discovery_ids.py
          python tests/test_cuts_discovery_harvest.py
          python tests/test_cuts_discovery_filter.py
          python tests/test_cuts_discovery_name_parity.py
